---
- name: Bootstrap k8sadmin user
  hosts: all
  gather_facts: false
  become: false

  vars:
    controller_public_key: >-
      {{ lookup('ansible.builtin.file',
      lookup('ansible.builtin.env', 'HOME') + '/.ssh/id_ed25519.pub') }}

  tasks:
    - name: Create k8sadmin user
      ansible.builtin.user:
        name: k8sadmin
        groups: sudo
        append: true
        shell: /bin/bash
        create_home: true

    - name: Create SSH directory
      ansible.builtin.file:
        path: /home/k8sadmin/.ssh
        state: directory
        owner: k8sadmin
        group: k8sadmin
        mode: "0700"

    - name: Install controller SSH public key
      ansible.builtin.lineinfile:
        path: /home/k8sadmin/.ssh/authorized_keys
        line: "{{ controller_public_key }}"
        create: true
        owner: k8sadmin
        group: k8sadmin
        mode: "0600"

    - name: Configure passwordless sudo for Ansible
      ansible.builtin.copy:
        dest: /etc/sudoers.d/k8sadmin
        content: "k8sadmin ALL=(ALL) NOPASSWD: ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: "/usr/sbin/visudo -cf %s"
