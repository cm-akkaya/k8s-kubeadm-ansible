---
- import_playbook: preflight.yml

- name: Configure package/image caching infrastructure
  hosts: localhost
  connection: local
  become: true
  gather_facts: true
  tags: [cache_infra]
  roles:
    - apt_cache_server
    - image_registry_cache

- name: Configure apt proxy on all cluster nodes
  hosts: kubernetes:load_balancers
  gather_facts: false
  become: true
  tags: [cache_infra]
  roles:
    - apt_cache_client

- name: Common configuration and hardening
  hosts: all
  gather_facts: true
  roles:
    - common
    - role: os_hardening
      tags: [os_hardening]

- name: Prepare Kubernetes nodes
  hosts: kubernetes
  gather_facts: true
  roles:
    - k8s_prerequisites
    - containerd
    - kubernetes_packages

- name: Prepare node disks (LVM growth + Longhorn data disk)
  hosts: kubernetes
  gather_facts: true
  tags: [disk_setup]
  roles:
    - disk_setup

- name: Configure API load balancers
  hosts: load_balancers
  gather_facts: true
  roles:
    - haproxy
    - keepalived

- name: Initialize primary control plane
  hosts: control_plane
  gather_facts: true
  tasks:
    - name: Initialize cluster
      ansible.builtin.include_role:
        name: kubeadm_init
      when: inventory_hostname == primary_control_plane

- name: Join remaining control plane nodes
  hosts: control_plane
  gather_facts: true
  serial: 1
  tasks:
    - name: Join additional control plane
      ansible.builtin.include_role:
        name: control_plane_join
      when: inventory_hostname != primary_control_plane

- name: Install Cilium
  hosts: control_plane
  gather_facts: true
  tasks:
    - name: Install Cilium on primary control plane
      ansible.builtin.include_role:
        name: cilium
      when: inventory_hostname == primary_control_plane

- name: Join workers
  hosts: workers
  gather_facts: true
  roles:
    - role: worker_join
      tags:
        - worker_join

- name: Validate completed cluster
  hosts: control_plane
  gather_facts: false
  tasks:
    - name: Run post checks
      ansible.builtin.include_role:
        name: post_checks
      when: inventory_hostname == primary_control_plane
