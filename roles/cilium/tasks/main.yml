---
- name: Remove legacy Helm repository definitions
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/helm.list
    - /etc/apt/sources.list.d/helm-stable-debian.list

- name: Configure Helm repository (via apt-cacher-ng HTTPS remap)
  ansible.builtin.deb822_repository:
    name: helm
    types:
      - deb
    uris:
      - "http://{{ apt_cache_helm_virtual_host }}/"
    suites:
      - any
    components:
      - main
    signed_by: https://packages.buildkite.com/helm-linux/helm-debian/gpgkey
    state: present
  tags: [cache_infra]

- name: Update apt cache after Helm repository configuration
  ansible.builtin.apt:
    update_cache: true

- name: Install Helm
  ansible.builtin.apt:
    name: helm
    state: present

- name: Check Cilium chart archive exists on controller
  ansible.builtin.stat:
    path: "{{ cilium_chart_controller_path }}"
  delegate_to: localhost
  become: false
  run_once: true
  register: cilium_chart_stat
  tags: [cilium]

- name: Assert Cilium chart archive is present on controller
  ansible.builtin.assert:
    that:
      - cilium_chart_stat.stat.exists
      - cilium_chart_stat.stat.size > 0
    fail_msg: >-
      Cilium chart arşivi bulunamadı veya boş: {{ cilium_chart_controller_path }}.
      Devam etmeden önce kaya-ansible (controller) üzerinde şunu çalıştırın:
      helm repo add cilium https://helm.cilium.io/ &&
      helm pull cilium/cilium --version {{ cilium_version }} --destination /opt/charts/
    success_msg: "Cilium chart arşivi mevcut: {{ cilium_chart_controller_path }}"
  run_once: true
  tags: [cilium]

- name: Copy local Cilium chart archive to control plane
  ansible.builtin.copy:
    src: "{{ cilium_chart_controller_path }}"
    dest: "{{ cilium_chart_remote_path }}"
    owner: root
    group: root
    mode: "0644"
  tags: [cilium]

- name: Install Cilium from local chart archive
  ansible.builtin.command:
    argv:
      - helm
      - upgrade
      - --install
      - cilium
      - "{{ cilium_chart_remote_path }}"
      - --namespace
      - kube-system
      - --set
      - "ipam.mode={{ cilium_ipam_mode }}"
      - --set
      - "routingMode={{ cilium_routing_mode }}"
      - --set
      - "tunnelProtocol={{ cilium_tunnel_protocol }}"
      - --set
      - "kubeProxyReplacement={{ cilium_kube_proxy_replacement | lower }}"
      - --set
      - "operator.replicas=2"
      - --wait
      - --timeout
      - 10m
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tags: [cilium]

- name: Remove temporary chart archive from control plane
  ansible.builtin.file:
    path: "{{ cilium_chart_remote_path }}"
    state: absent
  tags: [cilium]