---
- name: Create apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Remove legacy Docker repository definition
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

- name: Configure Docker repository (via apt-cacher-ng HTTPS remap)
  ansible.builtin.deb822_repository:
    name: docker
    types:
      - deb
    uris:
      - "http://{{ apt_cache_docker_virtual_host }}/"
    suites:
      - "{{ ansible_facts['distribution_release'] }}"
    components:
      - stable
    architectures:
      - amd64
    signed_by: https://download.docker.com/linux/ubuntu/gpg
    state: present
  tags: [cache_infra]

- name: Update apt cache after Docker repository configuration
  ansible.builtin.apt:
    update_cache: true

- name: Install containerd
  ansible.builtin.apt:
    name: "containerd.io={{ containerd_package_version }}"
    state: present
    allow_downgrade: true
    allow_change_held_packages: true
    update_cache: true

- name: Hold containerd
  ansible.builtin.dpkg_selections:
    name: containerd.io
    selection: hold

- name: Create containerd directory
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: "0755"

- name: Configure containerd
  ansible.builtin.template:
    src: config.toml.j2
    dest: /etc/containerd/config.toml
    owner: root
    group: root
    mode: "0644"
  notify: Restart containerd

- name: Create containerd registry certs.d directories
  ansible.builtin.file:
    path: "/etc/containerd/certs.d/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - registry.k8s.io
    - quay.io
  tags: [cache_infra]

- name: Configure registry.k8s.io mirror
  ansible.builtin.template:
    src: registry-hosts.toml.j2
    dest: /etc/containerd/certs.d/registry.k8s.io/hosts.toml
    mode: "0644"
  vars:
    upstream_registry: registry.k8s.io
    mirror_port: "{{ registry_mirror_k8s_port }}"
  notify: Restart containerd
  tags: [cache_infra]

- name: Configure quay.io mirror
  ansible.builtin.template:
    src: registry-hosts.toml.j2
    dest: /etc/containerd/certs.d/quay.io/hosts.toml
    mode: "0644"
  vars:
    upstream_registry: quay.io
    mirror_port: "{{ registry_mirror_quay_port }}"
  notify: Restart containerd
  tags: [cache_infra]

- name: Enable containerd
  ansible.builtin.service:
    name: containerd
    enabled: true
    state: started

- name: Apply containerd configuration
  ansible.builtin.meta: flush_handlers

- name: Hold containerd
  ansible.builtin.dpkg_selections:
    name: containerd.io
    selection: hold

- name: Verify containerd configuration
  ansible.builtin.command:
    cmd: containerd config dump
  register: containerd_config
  changed_when: false

- name: Verify SystemdCgroup
  ansible.builtin.assert:
    that:
      - "'SystemdCgroup = true' in containerd_config.stdout"
    fail_msg: "containerd SystemdCgroup=true değil."