---
- name: Check whether worker is already joined
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: worker_kubelet_conf

- name: Join worker node
  block:
    - name: Generate fresh worker join command
      ansible.builtin.command:
        cmd: kubeadm token create --print-join-command
      delegate_to: "{{ primary_control_plane }}"
      register: worker_join_output
      changed_when: true
      no_log: true

    - name: Extract worker join credentials
      ansible.builtin.set_fact:
        worker_kubeadm_join_token: >-
          {{ worker_join_output.stdout.split('--token ')[1].split()[0] }}
        worker_kubeadm_ca_cert_hash: >-
          {{ worker_join_output.stdout.split('--discovery-token-ca-cert-hash ')[1].split()[0] }}
      no_log: true

    - name: Create worker join configuration
      ansible.builtin.template:
        src: join-worker.yaml.j2
        dest: /etc/kubeadm-join-worker.yaml
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Join worker
      ansible.builtin.command:
        cmd: kubeadm join --config /etc/kubeadm-join-worker.yaml
        creates: /etc/kubernetes/kubelet.conf

  when: not worker_kubelet_conf.stat.exists

  always:
    - name: Remove temporary worker join configuration
      ansible.builtin.file:
        path: /etc/kubeadm-join-worker.yaml
        state: absent

- name: Label worker node
  ansible.builtin.command:
    cmd: >-
      kubectl --kubeconfig=/etc/kubernetes/admin.conf
      label node {{ inventory_hostname }} node-role.kubernetes.io/worker= --overwrite
  delegate_to: "{{ primary_control_plane }}"
  changed_when: true