---
- name: Install Kubernetes prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gpg
      - apt-transport-https
      - conntrack
      - socat
      - ethtool
      - nftables
    state: present
    update_cache: true

- name: Disable swap immediately
  ansible.builtin.command:
    cmd: swapoff -a
  changed_when: false

- name: Disable swap permanently
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#\n]+\s+[^#\n]+\s+swap\s+.*)$'
    replace: '# \1'

- name: Configure kernel modules
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      overlay
      br_netfilter

- name: Load overlay
  community.general.modprobe:
    name: overlay
    state: present

- name: Load br_netfilter
  community.general.modprobe:
    name: br_netfilter
    state: present

- name: Configure Kubernetes sysctl
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-kubernetes.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      net.bridge.bridge-nf-call-ip6tables = 1
      net.bridge.bridge-nf-call-iptables = 1
      net.ipv4.ip_forward = 1
  notify: Reload Kubernetes sysctl

- name: Flush sysctl handler
  ansible.builtin.meta: flush_handlers

- name: Verify swap
  ansible.builtin.command:
    cmd: swapon --show --noheadings
  register: swap_status
  changed_when: false
  failed_when: swap_status.stdout | length > 0

- name: Verify cgroup v2
  ansible.builtin.stat:
    path: /sys/fs/cgroup/cgroup.controllers
  register: cgroup_v2

- name: Assert cgroup v2
  ansible.builtin.assert:
    that:
      - cgroup_v2.stat.exists
    fail_msg: "cgroup v2 aktif değil."
