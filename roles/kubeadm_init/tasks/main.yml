---
- name: Create kubeadm config
  ansible.builtin.template:
    src: kubeadm-init.yaml.j2
    dest: /etc/kubernetes-kubeadm-init.yaml
    owner: root
    group: root
    mode: "0600"

- name: Pull Kubernetes images
  ansible.builtin.command:
    cmd: kubeadm config images pull --config /etc/kubernetes-kubeadm-init.yaml
  changed_when: false

- name: Initialize primary control plane
  ansible.builtin.command:
    cmd: kubeadm init --config /etc/kubernetes-kubeadm-init.yaml
    creates: /etc/kubernetes/admin.conf

- name: Create platform kubeconfig directory
  ansible.builtin.file:
    path: /home/platform/.kube
    state: directory
    owner: platform
    group: platform
    mode: "0700"

- name: Install kubeconfig for platform
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/platform/.kube/config
    remote_src: true
    owner: platform
    group: platform
    mode: "0600"

- name: Generate fresh join command
  ansible.builtin.command:
    cmd: kubeadm token create --print-join-command
  register: kubeadm_join_output
  no_log: true

- name: Upload control plane certificates
  ansible.builtin.command:
    cmd: kubeadm init phase upload-certs --upload-certs
  register: kubeadm_cert_output
  no_log: true

- name: Store temporary join information
  ansible.builtin.set_fact:
    kubeadm_join_token: >-
      {{ kubeadm_join_output.stdout.split('--token ')[1].split()[0] }}
    kubeadm_ca_cert_hash: >-
      {{ kubeadm_join_output.stdout.split('--discovery-token-ca-cert-hash ')[1].split()[0] }}
    kubeadm_certificate_key: >-
      {{ kubeadm_cert_output.stdout |
         regex_findall('(?m)^[a-f0-9]{64}$') |
         last }}
  no_log: true
