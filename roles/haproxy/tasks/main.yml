---
- name: Install PPA prerequisites
  ansible.builtin.apt:
    name: software-properties-common
    state: present
    update_cache: true

- name: Install APT keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Vincent Bernat HAProxy PPA signing key
  ansible.builtin.copy:
    src: vbernat-haproxy.gpg
    dest: /etc/apt/keyrings/vbernat-haproxy.gpg
    owner: root
    group: root
    mode: "0644"

- name: Configure HAProxy PPA repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/vbernat-haproxy.gpg]
      https://ppa.launchpadcontent.net/vbernat/haproxy-{{ haproxy_ppa_version }}/ubuntu
      noble main
    filename: vbernat-haproxy
    state: present
    update_cache: true

- name: Install HAProxy
  ansible.builtin.apt:
    name: "haproxy={{ haproxy_version }}"
    state: present
    update_cache: true

- name: Configure HAProxy
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: root
    mode: "0644"
    validate: "/usr/sbin/haproxy -c -f %s"
  notify: Restart HAProxy

- name: Enable HAProxy
  ansible.builtin.service:
    name: haproxy
    state: started
    enabled: true

- name: Force HAProxy handler
  ansible.builtin.meta: flush_handlers

- name: Verify HAProxy listener
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ api_port }}"
    timeout: 30