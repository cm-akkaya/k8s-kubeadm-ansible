---
- name: Wait for all Kubernetes nodes
  ansible.builtin.command:
    cmd: >-
      kubectl --kubeconfig=/etc/kubernetes/admin.conf
      wait --for=condition=Ready nodes --all --timeout=600s
  changed_when: false

- name: Wait for Cilium
  ansible.builtin.command:
    cmd: >-
      kubectl --kubeconfig=/etc/kubernetes/admin.conf
      -n kube-system rollout status daemonset/cilium --timeout=600s
  changed_when: false

- name: Wait for CoreDNS
  ansible.builtin.command:
    cmd: >-
      kubectl --kubeconfig=/etc/kubernetes/admin.conf
      -n kube-system rollout status deployment/coredns --timeout=600s
  changed_when: false

- name: Get nodes
  ansible.builtin.command:
    cmd: kubectl --kubeconfig=/etc/kubernetes/admin.conf get nodes -o wide
  register: nodes_output
  changed_when: false

- name: Show nodes
  ansible.builtin.debug:
    var: nodes_output.stdout_lines

- name: Get cluster pods
  ansible.builtin.command:
    cmd: kubectl --kubeconfig=/etc/kubernetes/admin.conf get pods -A
  register: pods_output
  changed_when: false

- name: Show pods
  ansible.builtin.debug:
    var: pods_output.stdout_lines
